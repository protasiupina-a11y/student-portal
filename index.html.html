<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Portal</title>


    <style>
        body{
            padding: 0;
            margin: 0;
            align-items: center;
            align-content: center;
            text-align: center;
            background-color: white;
            color: black;
        }

        .nav{
            display: flex;
            padding: 10px 40px;
            justify-content: space-between;
            align-items: center;
            background: skyblue;
            color: white;
        }
        .navbar{
            margin-left: 20px;
            text-decoration: none;
            font-weight: bold;
            justify-content: space-around;
            color: white;
        }
        .logo{
            border: solid;
            border-radius: 50%;
            object-fit: cover;
            width: 100px;
            height: 100px;
        }
        .hero-image{
            height: 450px;
            width: 100%;
            object-fit: cover;
            
        }
        .hero{
            width: 95%;
            height: 50%;
            margin: 0 auto;
            padding-top: 5px;
            margin-top: 10px;
            
        }
        table{
            
            align-content: center;
            width: 75%;
            border-collapse: collapse;
            margin: 0 auto;
            font-size: 16px;
            text-align: center;
            background-color: white;
            margin-top: 10px;

        }
        th, td {
            padding: 12px 15px;
            border: 1px solid;
        }
        th{
            background-color: silver;
            color: black;
        }
        .table-header{
            font-size: 25px;
            font-weight: 5px;

        }
    </style>
</head>
<body>
    <div class="nav">
        
        <img src="picha.jpg" class="logo">
        
        <div class="navbar">
            <a href="#">Home</a>
            <a href="#">About</a>
            <a href="#">Contact Us</a>
        </div>
    </div>


    <div class="hero">
        <img src="picha.jpg.jpg" class="hero-image">
        <div class="hero-content">
            <h2>WELCOME TO OUR UNIVERSITY!!.</h2>
        </div>
    </div>


    <div class="table">
        <div class="table-header">Students Information.</div>
        <div>
            <table>
                <thead>
                    <tr>
                        <th>Student Name</th>
                        <th>Student Class</th>
                        <th>Student Grade</th>
                    </tr>
                </thead>

                <tbody>
                    <tr>
                        <td>Monica Mussa</td>
                        <td>YearIII</td>
                        <td>B</td>
                    </tr>
                    <tr>
                        <td>Daniella Maiga</td>
                        <td>Year II</td>
                        <td>C</td>
                    </tr>
                    <tr>
                        <td>Benson Peter</td>
                        <td>Year I</td>
                        <td>A</td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>

    <div class="footer">
        <footer>
            <p>&copy; 2026 Developed by Protasi Gregory Upina. All Rights Reserved.</p>
        </footer>
    </div>
</body>
</html>
